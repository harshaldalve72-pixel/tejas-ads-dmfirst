  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0088cc, #005bea);
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .telegram-icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .telegram-icon svg {
      width: 48px;
      height: 48px;
      fill: #0088cc;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .description {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 28px;
    }

    .countdown {
      font-size: 17px;
      margin-bottom: 20px;
    }

    #timer {
      font-weight: bold;
      font-size: 22px;
    }

    .join-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: white;
      color: #0088cc;
      text-decoration: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.25s ease;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.75;
    }

    @media (max-width: 480px) {
      .container {
        padding: 35px 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="telegram-icon">
      <svg viewBox="0 0 24 24">
        <path d="M21.8 3.2L18.5 20c-.25 1.18-.91 1.47-1.85.91l-5.1-3.76-2.46 2.37c-.27.27-.5.5-1.02.5l.36-5.19 9.45-8.54c.41-.36-.09-.56-.64-.2L5.55 13.02.47 11.43c-1.1-.34-1.12-1.1.23-1.63L20.55 2.1c.91-.34 1.71.2 1.25 1.1z"/>
      </svg>
    </div>

    <h1>Join Our Telegram</h1>

    <p class="description">
      Get the latest updates, announcements and exclusive content
      directly on Telegram.
    </p>

    <div class="countdown">
      Redirecting in <span id="timer">2</span> seconds...
    </div>

    <a
      class="join-btn"
      href="https://t.me/+5Y7cAov_EPVlMWM1"
    >
      🚀 Join Telegram Channel
    </a>

    <p class="note">
      If you are not redirected automatically, click the button above.
    </p>

  </div>


  <!-- ============================= -->
  <!-- Telegram Redirect -->
  <!-- ============================= -->

  <script>
    const telegramLink = "https://t.me/+5Y7cAov_EPVlMWM1";

    let seconds = 2;
    const timer = document.getElementById("timer");

    const countdown = setInterval(() => {
      seconds--;

      if (seconds > 0) {
        timer.textContent = seconds;
      } else {
        clearInterval(countdown);
        window.location.href = telegramLink;
      }
    }, 1000);
  </script>

</body>
</html>
